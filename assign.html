<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Planner</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f4f4;
}

header{
    background:#4169e1;
    color:black;
    text-align:center;
    padding:30px;
}

header h1{
    color:black;
}

.nav{
    display:flex;
    background:#3156d9;
}

.nav button{
    flex:1;
    border:none;
    background:#3156d9;
    color:white;
    padding:20px;
    cursor:pointer;
    font-size:18px;
}

.nav button:hover{
    background:#2448c7;
}

.tab{
    display:none;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

.card h2{
    color:black;
}

input,
select{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    box-sizing:border-box;
}

textarea{
    width:100%;
    padding:10px;
    height:100px;
    resize:none;
    box-sizing:border-box;
    margin-bottom:10px;
}

.addBtn{
    background:#4169e1;
    color:white;
    border:none;
    padding:10px 20px;
    cursor:pointer;
    border-radius:5px;
}

.addBtn:hover{
    background:#3156d9;
}

.smallBtn{
    background:#6c757d;
    color:white;
    border:none;
    padding:8px 12px;
    cursor:pointer;
    border-radius:5px;
    margin-left:8px;
    font-size:14px;
}

.smallBtn:hover{
    background:#5a6268;
}

#assignmentList,
#classList,
#quizList{
    background:#222;
    color:white;
    min-height:200px;
    padding:15px;
    border-radius:10px;
}

.assignment-preview,
.class-preview,
.quiz-preview{
    border-bottom:1px solid #555;
    padding:15px 0;
}

.assignment-preview strong,
.quiz-preview strong{
    font-size:20px;
}

.color-preview{
    width:100%;
    height:40px;
    border-radius:5px;
    margin-bottom:10px;
    border:1px solid #ccc;
}

.deleteBtn{
    background:#ff4444;
    color:white;
    border:none;
    padding:5px 10px;
    margin-left:10px;
    cursor:pointer;
    border-radius:5px;
}

.deleteBtn:hover{
    background:#cc0000;
}

/* CALENDAR */

.calendar-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
    color:black;
}

.calendar-header h2{
    margin:0;
    font-size:24px;
    color:black;
}

.cal-btn{
    background:#4169e1;
    color:white;
    border:none;
    padding:8px 15px;
    cursor:pointer;
    border-radius:5px;
    font-size:16px;
}

.cal-btn:hover{
    background:#3156d9;
}

.weekdays{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    text-align:center;
    font-weight:bold;
    margin-bottom:5px;
}

.weekdays div{
    padding:10px 0;
    background:#3156d9;
    color:white;
    border-radius:5px;
}

.calendar-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:5px;
}

.calendar-day{
    background:white;
    min-height:120px;
    padding:5px;
    border-radius:5px;
    font-size:14px;
    position:relative;
    border:1px solid #ddd;
    color:black;
}

.event{
    margin-top:5px;
    padding:3px 5px;
    border-radius:4px;
    color:white;
    font-size:12px;
    font-weight:bold;
    display:flex;
    align-items:center;
    gap:6px;
}

.event .icon{
    font-size:12px;
}

.day-number{
    font-weight:bold;
    font-size:16px;
    color:black;
}

</style>
</head>

<body>

<header>
    <h1>Student Planner</h1>
</header>

<div class="nav">

    <button onclick="showTab('assignments')">Assignments</button>
    <button onclick="showTab('classes')">Classes</button>
    <button onclick="showTab('tests')">Tests & Quizzes</button>
    <button onclick="showTab('calendar')">Calendar</button>

</div>

<!-- ASSIGNMENTS -->

<div id="assignments" class="tab">

    <div class="card">

        <h2>Add Assignment</h2>

        <input id="assignmentName" type="text" placeholder="Assignment Name">

        <select id="assignmentClass">
            <option value="">Select Class</option>
        </select>

        <input id="assignmentDue" type="date">

        <textarea id="assignmentNotes" placeholder="Assignment Notes"></textarea>

        <div style="display:flex; gap:10px; align-items:center;">
            <button class="addBtn" onclick="addAssignment()">Add Assignment</button>

            <!-- Export / Import buttons placed in assignment tab as requested -->
            <button class="smallBtn" onclick="exportData()">Export Data</button>
            <button class="smallBtn" onclick="triggerImport()">Import Data</button>

            <input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(event)">
        </div>

    </div>

    <div class="card">
        <h2>Assignment List</h2>
        <div id="assignmentList">No assignments yet.</div>
    </div>

</div>

<!-- CLASSES -->

<div id="classes" class="tab">

    <div class="card">

        <h2>Add Class</h2>

        <input id="className" type="text" placeholder="Class Name">

        <select id="classColor" onchange="updateColorPreview()">
            <option value="#00FFFF">Cyan</option>
            <option value="#00FF00">Lime Green</option>
            <option value="#FFD700">Gold</option>
            <option value="#FF4500">Orange Red</option>
            <option value="#FF1493">Hot Pink</option>
            <option value="#9370DB">Purple</option>
            <option value="#1E90FF">Dodger Blue</option>
            <option value="#FF69B4">Pink</option>
            <option value="#7FFF00">Chartreuse</option>
            <option value="#FFA500">Orange</option>
        </select>

        <div id="colorPreview" class="color-preview" style="background:#00FFFF;"></div>

        <button class="addBtn" onclick="addClass()">Add Class</button>

    </div>

    <div class="card">

        <h2>Class List</h2>

        <div id="classList">No classes added yet.</div>

    </div>

</div>

<!-- TESTS & QUIZZES -->

<div id="tests" class="tab">

    <div class="card">

        <h2>Add Test / Quiz</h2>

        <input id="quizName" type="text" placeholder="Quiz/Test Name">

        <select id="quizClass">
            <option value="">Select Class</option>
        </select>

        <input id="quizDate" type="date">

        <textarea id="quizNotes" placeholder="Notes"></textarea>

        <button class="addBtn" onclick="addQuiz()">Add Quiz/Test</button>

    </div>

    <div class="card">

        <h2>Quiz/Test List</h2>

        <div id="quizList">No quizzes or tests yet.</div>

    </div>

</div>

<!-- CALENDAR -->

<div id="calendar" class="tab">

    <div class="card">

        <div class="calendar-header">
            <button class="cal-btn" onclick="prevMonth()">◀</button>
            <h2 id="monthLabel"></h2>
            <button class="cal-btn" onclick="nextMonth()">▶</button>
        </div>

        <div class="weekdays">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>

        <div id="calendarGrid" class="calendar-grid"></div>

    </div>

</div>

<script>
/* -------------------------
   STATE: current calendar month/year
--------------------------*/
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth();

/* -------------------------
   UI helpers
--------------------------*/
function showTab(tabId){
    document.getElementById("assignments").style.display = "none";
    document.getElementById("classes").style.display = "none";
    document.getElementById("tests").style.display = "none";
    document.getElementById("calendar").style.display = "none";
    document.getElementById(tabId).style.display = "block";
}

/* -------------------------
   CLASS MANAGEMENT
--------------------------*/
function updateColorPreview(){
    let color = document.getElementById("classColor").value;
    document.getElementById("colorPreview").style.background = color;
}

function createClassEntry(className, classColor){
    // Avoid duplicates
    let existing = document.querySelectorAll("#classList .class-preview");
    for(let i=0;i<existing.length;i++){
        if(existing[i].getAttribute("data-class") === className){
            return; // skip duplicate
        }
    }

    let classList = document.getElementById("classList");
    if(classList.innerHTML.trim() === "No classes added yet."){
        classList.innerHTML = "";
    }

    let div = document.createElement("div");
    div.className = "class-preview";
    div.setAttribute("data-class", className);

    let span = document.createElement("span");
    span.style.color = classColor;
    span.style.fontWeight = "bold";
    span.innerText = "■ " + className;

    let btn = document.createElement("button");
    btn.className = "deleteBtn";
    btn.innerText = "Delete";
    btn.onclick = function(){ deleteClass(className); };

    div.appendChild(span);
    div.appendChild(btn);
    classList.appendChild(div);

    // Add to assignment dropdown
    let option1 = document.createElement("option");
    option1.value = className;
    option1.text = className;
    option1.setAttribute("data-color", classColor);
    document.getElementById("assignmentClass").appendChild(option1);

    // Add to quiz dropdown
    let option2 = document.createElement("option");
    option2.value = className;
    option2.text = className;
    option2.setAttribute("data-color", classColor);
    document.getElementById("quizClass").appendChild(option2);
}

function addClass(){
    let className = document.getElementById("className").value;
    let classColor = document.getElementById("classColor").value;

    if(className.trim() === ""){
        alert("Enter a class name.");
        return;
    }

    createClassEntry(className, classColor);
    document.getElementById("className").value = "";
}

function deleteClass(className){
    // Remove from class list
    let classList = document.getElementById("classList");
    let items = classList.querySelectorAll(".class-preview");

    items.forEach(item => {
        if(item.getAttribute("data-class") === className){
            item.remove();
        }
    });

    if(classList.children.length === 0){
        classList.innerHTML = "No classes added yet.";
    }

    // Remove from assignment dropdown
    let dropdown1 = document.getElementById("assignmentClass");
    for(let i = 0; i < dropdown1.options.length; i++){
        if(dropdown1.options[i].value === className){
            dropdown1.remove(i);
            break;
        }
    }

    // Remove from quiz dropdown
    let dropdown2 = document.getElementById("quizClass");
    for(let i = 0; i < dropdown2.options.length; i++){
        if(dropdown2.options[i].value === className){
            dropdown2.remove(i);
            break;
        }
    }

    renderCalendar();
}

/* -------------------------
   ASSIGNMENTS
--------------------------*/
function createAssignmentEntry(name, className, dueDate, notes, classColor){
    // Avoid duplicate assignment names (simple approach)
    let existing = document.querySelectorAll("#assignmentList .assignment-preview");
    for(let i=0;i<existing.length;i++){
        if(existing[i].getAttribute("data-assignment") === name){
            // If duplicate name exists, append a suffix to keep unique
            name = name + " (imported)";
            break;
        }
    }

    let assignmentList = document.getElementById("assignmentList");
    if(assignmentList.innerHTML.trim() === "No assignments yet."){
        assignmentList.innerHTML = "";
    }

    let div = document.createElement("div");
    div.className = "assignment-preview";
    div.setAttribute("data-assignment", name);
    div.setAttribute("data-date", dueDate || "");
    div.setAttribute("data-color", classColor || "white");

    let strong = document.createElement("strong");
    strong.style.color = classColor || "white";
    strong.innerText = "■ " + name;

    div.appendChild(strong);
    div.appendChild(document.createElement("br"));
    div.appendChild(document.createElement("br"));

    let bClass = document.createElement("b");
    bClass.innerText = "Class:";
    div.appendChild(bClass);
    div.appendChild(document.createTextNode(" " + (className || "")));
    div.appendChild(document.createElement("br"));

    let bDue = document.createElement("b");
    bDue.innerText = "Due Date:";
    div.appendChild(bDue);
    div.appendChild(document.createTextNode(" " + (dueDate || "")));
    div.appendChild(document.createElement("br"));

    let bNotes = document.createElement("b");
    bNotes.innerText = "Notes:";
    div.appendChild(bNotes);
    div.appendChild(document.createTextNode(" " + (notes || "")));
    div.appendChild(document.createElement("br"));

    let btn = document.createElement("button");
    btn.className = "deleteBtn";
    btn.innerText = "Delete";
    btn.onclick = function(){ deleteAssignment(name); };

    div.appendChild(btn);
    assignmentList.appendChild(div);
}

function addAssignment(){
    let name = document.getElementById("assignmentName").value;
    let classDropdown = document.getElementById("assignmentClass");
    let className = classDropdown.value;
    let dueDate = document.getElementById("assignmentDue").value;
    let notes = document.getElementById("assignmentNotes").value;

    if(name.trim() === ""){
        alert("Enter an assignment name.");
        return;
    }

    let selectedOption = classDropdown.options[classDropdown.selectedIndex];
    let classColor = selectedOption ? selectedOption.getAttribute("data-color") : "white";

    createAssignmentEntry(name, className, dueDate, notes, classColor);

    document.getElementById("assignmentName").value = "";
    document.getElementById("assignmentClass").selectedIndex = 0;
    document.getElementById("assignmentDue").value = "";
    document.getElementById("assignmentNotes").value = "";

    renderCalendar();
}

function deleteAssignment(name){
    let list = document.getElementById("assignmentList");
    let items = list.querySelectorAll(".assignment-preview");

    items.forEach(item => {
        if(item.getAttribute("data-assignment") === name){
            item.remove();
        }
    });

    if(list.children.length === 0){
        list.innerHTML = "No assignments yet.";
    }

    renderCalendar();
}

/* -------------------------
   QUIZZES / TESTS
--------------------------*/
function createQuizEntry(name, className, date, notes, classColor){
    // Avoid duplicate quiz names
    let existing = document.querySelectorAll("#quizList .quiz-preview");
    for(let i=0;i<existing.length;i++){
        if(existing[i].getAttribute("data-quiz") === name){
            name = name + " (imported)";
            break;
        }
    }

    let quizList = document.getElementById("quizList");
    if(quizList.innerHTML.trim() === "No quizzes or tests yet."){
        quizList.innerHTML = "";
    }

    let div = document.createElement("div");
    div.className = "quiz-preview";
    div.setAttribute("data-quiz", name);
    div.setAttribute("data-date", date || "");
    div.setAttribute("data-color", classColor || "white");

    let strong = document.createElement("strong");
    strong.style.color = classColor || "white";
    strong.innerText = "■ " + name;

    div.appendChild(strong);
    div.appendChild(document.createElement("br"));
    div.appendChild(document.createElement("br"));

    let bClass = document.createElement("b");
    bClass.innerText = "Class:";
    div.appendChild(bClass);
    div.appendChild(document.createTextNode(" " + (className || "")));
    div.appendChild(document.createElement("br"));

    let bDate = document.createElement("b");
    bDate.innerText = "Date:";
    div.appendChild(bDate);
    div.appendChild(document.createTextNode(" " + (date || "")));
    div.appendChild(document.createElement("br"));

    let bNotes = document.createElement("b");
    bNotes.innerText = "Notes:";
    div.appendChild(bNotes);
    div.appendChild(document.createTextNode(" " + (notes || "")));
    div.appendChild(document.createElement("br"));

    let btn = document.createElement("button");
    btn.className = "deleteBtn";
    btn.innerText = "Delete";
    btn.onclick = function(){ deleteQuiz(name); };

    div.appendChild(btn);
    quizList.appendChild(div);
}

function addQuiz(){
    let name = document.getElementById("quizName").value;
    let classDropdown = document.getElementById("quizClass");
    let className = classDropdown.value;
    let date = document.getElementById("quizDate").value;
    let notes = document.getElementById("quizNotes").value;

    if(name.trim() === ""){
        alert("Enter a quiz/test name.");
        return;
    }

    let selectedOption = classDropdown.options[classDropdown.selectedIndex];
    let classColor = selectedOption ? selectedOption.getAttribute("data-color") : "white";

    createQuizEntry(name, className, date, notes, classColor);

    document.getElementById("quizName").value = "";
    document.getElementById("quizClass").selectedIndex = 0;
    document.getElementById("quizDate").value = "";
    document.getElementById("quizNotes").value = "";

    renderCalendar();
}

function deleteQuiz(name){
    let list = document.getElementById("quizList");
    let items = list.querySelectorAll(".quiz-preview");

    items.forEach(item => {
        if(item.getAttribute("data-quiz") === name){
            item.remove();
        }
    });

    if(list.children.length === 0){
        list.innerHTML = "No quizzes or tests yet.";
    }

    renderCalendar();
}

/* -------------------------
   EXPORT / IMPORT
--------------------------*/
function exportData(){
    // Gather classes
    let classes = [];
    let classOptions = document.querySelectorAll("#assignmentClass option, #quizClass option");
    // We'll gather classes from classList to preserve colors and avoid duplicates
    let classNodes = document.querySelectorAll("#classList .class-preview");
    classNodes.forEach(node => {
        let name = node.getAttribute("data-class");
        // find color from dropdown option
        let color = "white";
        // search assignmentClass options
        let opts = document.getElementById("assignmentClass").options;
        for(let i=0;i<opts.length;i++){
            if(opts[i].value === name){
                color = opts[i].getAttribute("data-color") || color;
                break;
            }
        }
        classes.push({ name: name, color: color });
    });

    // Gather assignments
    let assignments = [];
    let aNodes = document.querySelectorAll("#assignmentList .assignment-preview");
    aNodes.forEach(node => {
        assignments.push({
            name: node.getAttribute("data-assignment") || "",
            class: node.querySelector("b") ? node.querySelector("b").nextSibling.nodeValue.trim() : "",
            date: node.getAttribute("data-date") || "",
            notes: (function(){
                // notes are after "Notes:" label; fallback to innerText parsing
                let txt = node.innerText || "";
                let idx = txt.indexOf("Notes:");
                if(idx >= 0) return txt.substring(idx + 6).trim();
                return "";
            })(),
            color: node.getAttribute("data-color") || ""
        });
    });

    // Gather quizzes
    let quizzes = [];
    let qNodes = document.querySelectorAll("#quizList .quiz-preview");
    qNodes.forEach(node => {
        quizzes.push({
            name: node.getAttribute("data-quiz") || "",
            class: node.querySelector("b") ? node.querySelector("b").nextSibling.nodeValue.trim() : "",
            date: node.getAttribute("data-date") || "",
            notes: (function(){
                let txt = node.innerText || "";
                let idx = txt.indexOf("Notes:");
                if(idx >= 0) return txt.substring(idx + 6).trim();
                return "";
            })(),
            color: node.getAttribute("data-color") || ""
        });
    });

    let payload = {
        exportedAt: new Date().toISOString(),
        classes: classes,
        assignments: assignments,
        quizzes: quizzes
    };

    let blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    let url = URL.createObjectURL(blob);
    let a = document.createElement("a");
    a.href = url;
    a.download = "student_planner_export_" + (new Date().toISOString().slice(0,10)) + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
}

function triggerImport(){
    document.getElementById("importFile").value = "";
    document.getElementById("importFile").click();
}

function importData(event){
    let file = event.target.files[0];
    if(!file) return;

    let reader = new FileReader();
    reader.onload = function(e){
        try{
            let data = JSON.parse(e.target.result);

            // Clear existing classes, assignments, quizzes
            clearAllData();

            // Import classes first
            if(Array.isArray(data.classes)){
                data.classes.forEach(c => {
                    if(c && c.name){
                        createClassEntry(c.name, c.color || "#1E90FF");
                    }
                });
            }

            // Import assignments
            if(Array.isArray(data.assignments)){
                data.assignments.forEach(a => {
                    // find color for class if available
                    let color = findColorForClass(a.class) || (a.color || "#1E90FF");
                    createAssignmentEntry(a.name || "", a.class || "", a.date || "", a.notes || "", color);
                });
            }

            // Import quizzes
            if(Array.isArray(data.quizzes)){
                data.quizzes.forEach(q => {
                    let color = findColorForClass(q.class) || (q.color || "#1E90FF");
                    createQuizEntry(q.name || "", q.class || "", q.date || "", q.notes || "", color);
                });
            }

            renderCalendar();
            alert("Import successful.");
        } catch(err){
            alert("Failed to import file. Make sure it's a valid export JSON.");
            console.error(err);
        }
    };
    reader.readAsText(file);
}

function clearAllData(){
    // Clear class list and dropdowns
    document.getElementById("classList").innerHTML = "No classes added yet.";

    // Reset assignmentClass and quizClass to only default option
    let ac = document.getElementById("assignmentClass");
    ac.innerHTML = "<option value=''>Select Class</option>";
    let qc = document.getElementById("quizClass");
    qc.innerHTML = "<option value=''>Select Class</option>";

    // Clear assignments and quizzes
    document.getElementById("assignmentList").innerHTML = "No assignments yet.";
    document.getElementById("quizList").innerHTML = "No quizzes or tests yet.";
}

function findColorForClass(className){
    if(!className) return null;
    let opts = document.getElementById("assignmentClass").options;
    for(let i=0;i<opts.length;i++){
        if(opts[i].value === className){
            return opts[i].getAttribute("data-color") || null;
        }
    }
    return null;
}

/* -------------------------
   CALENDAR SYSTEM
--------------------------*/
function renderCalendar(){

    let grid = document.getElementById("calendarGrid");
    grid.innerHTML = "";

    let monthNames = [
        "January","February","March","April","May","June",
        "July","August","September","October","November","December"
    ];

    document.getElementById("monthLabel").innerText =
        `${monthNames[currentMonth]} ${currentYear}`;

    let firstDay = new Date(currentYear, currentMonth, 1).getDay();
    let daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

    // blank leading cells
    for(let i = 0; i < firstDay; i++){
        grid.innerHTML += "<div class='calendar-day'></div>";
    }

    for(let day = 1; day <= daysInMonth; day++){
        let dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

        let cell = document.createElement("div");
        cell.className = "calendar-day";
        cell.innerHTML = `<div class='day-number'>${day}</div>`;

        // Add assignments
        let assignments = document.querySelectorAll(".assignment-preview");
        assignments.forEach(a => {
            if(a.getAttribute("data-date") === dateStr){
                let color = a.getAttribute("data-color") || "#1E90FF";
                let name = a.getAttribute("data-assignment") || "";

                let event = document.createElement("div");
                event.className = "event";
                event.style.background = color;
                event.innerText = name;

                cell.appendChild(event);
            }
        });

        // Add quizzes (with warning icon)
        let quizzes = document.querySelectorAll(".quiz-preview");
        quizzes.forEach(q => {
            if(q.getAttribute("data-date") === dateStr){
                let color = q.getAttribute("data-color") || "#1E90FF";
                let name = q.getAttribute("data-quiz") || "";

                let event = document.createElement("div");
                event.className = "event";
                event.style.background = color;

                // icon span
                let icon = document.createElement("span");
                icon.className = "icon";
                icon.innerText = "⚠️";

                let text = document.createElement("span");
                text.innerText = name;

                event.appendChild(icon);
                event.appendChild(text);

                cell.appendChild(event);
            }
        });

        grid.appendChild(cell);
    }
}

function prevMonth(){
    currentMonth--;
    if(currentMonth < 0){
        currentMonth = 11;
        currentYear--;
    }
    renderCalendar();
}

function nextMonth(){
    currentMonth++;
    if(currentMonth > 11){
        currentMonth = 0;
        currentYear++;
    }
    renderCalendar();
}
