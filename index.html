<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Student Planner</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="planner.css">
</head>
<body>

<header>
  <h1>Student Planner</h1>
</header>

<div class="nav">
  <button onclick="showTab('assignments')">Assignments</button>
  <button onclick="showTab('classes')">Classes</button>
  <button onclick="showTab('tests')">Tests & Quizzes</button>
  <button onclick="showTab('calendar')">Calendar</button>
</div>

<!-- ASSIGNMENTS TAB (mobile-first UI) -->
<div id="assignments" class="tab">

  <div class="card form-card mobile-form">
    <h2>Add Assignment</h2>

    <label class="field">
      <span class="field-label">Assignment</span>
      <input id="assignmentName" type="text" placeholder="e.g., Read Chapter 4">
    </label>

    <label class="field">
      <span class="field-label">Class</span>
      <select id="assignmentClass">
        <option value="">Select Class</option>
      </select>
    </label>

    <div class="row two-up">
      <label class="field small">
        <span class="field-label">Due</span>
        <input id="assignmentDue" type="date">
      </label>

      <label class="field small">
        <span class="field-label">Time (optional)</span>
        <input id="assignmentTime" type="time">
      </label>
    </div>

    <label class="field">
      <span class="field-label">Notes</span>
      <textarea id="assignmentNotes" placeholder="Short notes (optional)"></textarea>
    </label>

    <div class="form-actions mobile-actions">
      <button class="addBtn" onclick="addAssignment()">Add</button>

      <div class="secondary-actions">
        <button class="smallBtn" onclick="exportData()">Export</button>
        <button class="smallBtn" onclick="triggerImport()">Import</button>
        <input id="importFile" type="file" accept="application/json" style="display:none">
      </div>
    </div>
  </div>

  <div class="card list-card mobile-list">
    <div class="list-header">
      <h2>Assignments</h2>
      <div class="list-controls">
        <button class="smallBtn" onclick="showTab('classes')">Add Class</button>
      </div>
    </div>

    <div id="assignmentList" class="compact-list">No assignments yet.</div>
  </div>

  <!-- Floating Add Button for quick mobile access -->
  <button id="fabAddAssignment" class="fab" onclick="showTab('assignments'); document.getElementById('assignmentName').focus();">
    +
  </button>
</div>

<!-- CLASSES TAB -->
<div id="classes" class="tab">
  <div class="card form-card">
    <h2>Add Class</h2>

    <div class="form-row">
      <label for="className">Class Name</label>
      <input id="className" type="text" placeholder="Class Name">
    </div>

    <div class="form-row">
      <label for="classColor">Color</label>
      <select id="classColor" onchange="updateColorPreview()">
        <option value="#000000">Black</option>
        <option value="#1E90FF">Blue</option>
        <option value="#FF4500">Red</option>
        <option value="#FFD700">Gold</option>
        <option value="#00FF00">Green</option>
      </select>
    </div>

    <div id="colorPreview" class="color-preview" aria-hidden="true"></div>

    <div class="form-row two-col">
      <div>
        <label for="classDay1">Class Day 1</label>
        <select id="classDay1">
          <option value="">Select Day</option>
          <option value="Mon">Monday</option>
          <option value="Tue">Tuesday</option>
          <option value="Wed">Wednesday</option>
          <option value="Thu">Thursday</option>
          <option value="Fri">Friday</option>
        </select>
      </div>
      <div>
        <label for="classDay2">Class Day 2</label>
        <select id="classDay2">
          <option value="">None</option>
          <option value="Mon">Monday</option>
          <option value="Tue">Tuesday</option>
          <option value="Wed">Wednesday</option>
          <option value="Thu">Thursday</option>
          <option value="Fri">Friday</option>
        </select>
      </div>
    </div>

    <div class="form-row two-col">
      <div>
        <label for="classStart">Start Time</label>
        <input id="classStart" type="time">
      </div>
      <div>
        <label for="classEnd">End Time</label>
        <input id="classEnd" type="time">
      </div>
    </div>

    <div class="form-actions">
      <button class="addBtn" onclick="addClass()">Add Class</button>
    </div>
  </div>

  <div class="card list-card">
    <h2>Class List</h2>
    <div id="classList">No classes added yet.</div>
  </div>
</div>

<!-- TESTS & QUIZZES TAB -->
<div id="tests" class="tab">
  <div class="card form-card">
    <h2>Add Test / Quiz</h2>

    <div class="form-row">
      <label for="quizName">Quiz/Test Name</label>
      <input id="quizName" type="text" placeholder="Quiz/Test Name">
    </div>

    <div class="form-row">
      <label for="quizClass">Class</label>
      <select id="quizClass">
        <option value="">Select Class</option>
      </select>
    </div>

    <div class="form-row two-col">
      <div>
        <label for="quizDate">Date</label>
        <input id="quizDate" type="date">
      </div>
      <div>
        <label for="quizNotes">Notes</label>
        <input id="quizNotes" type="text" placeholder="Short notes">
      </div>
    </div>

    <div class="form-actions">
      <button class="addBtn" onclick="addQuiz()">Add Quiz/Test</button>
    </div>
  </div>

  <div class="card list-card">
    <h2>Quiz/Test List</h2>
    <div id="quizList">No quizzes or tests yet.</div>
  </div>
</div>

<!-- CALENDAR TAB -->
<div id="calendar" class="tab">
  <div class="card calendar-card">
    <div class="calendar-header">
      <button class="cal-btn" onclick="prevMonth()">◀</button>
      <h2 id="monthLabel" class="month-label">Month Year</h2>
      <button class="cal-btn" onclick="nextMonth()">▶</button>
    </div>

    <div class="weekdays">
      <div>Sun</div>
      <div>Mon</div>
      <div>Tue</div>
      <div>Wed</div>
      <div>Thu</div>
      <div>Fri</div>
      <div>Sat</div>
    </div>

    <div id="calendarGrid" class="calendar-grid"></div>
  </div>
</div>

<script src="planner.js" defer></script>
</body>
</html>
